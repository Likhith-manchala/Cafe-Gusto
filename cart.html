<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout | Cafe Gusto</title><link rel="stylesheet" href="app.css"></head>
<body class="cart-page"><main class="cart-shell"><header class="page-header"><div><p class="eyebrow">CAFE GUSTO <span>•</span> CHECKOUT</p><h1>Your table, almost ready.</h1></div><a class="nav-link" href="menu.html">Back to menu</a></header><div id="cart-items"></div><div class="cart-total" id="cart-total"></div><form class="form-grid" onsubmit="event.preventDefault(); placeOrder()"><label for="customer-name">Your name</label><input id="customer-name" required placeholder="Enter your name"><label for="table-number">Table number</label><input id="table-number" readonly value="Assigned automatically at checkout"><label for="payment-method">Payment method</label><select id="payment-method" onchange="document.querySelector('#payment-reference').parentElement.hidden = this.value === 'cash'"><option value="upi">UPI</option><option value="card">Credit / debit card</option><option value="cash">Pay at the table</option></select><div><label for="payment-reference">Payment reference</label><input id="payment-reference" placeholder="UPI ID or card last 4 digits" maxlength="40"></div><p class="notice">Online payments are securely simulated for this demo checkout. Never enter a full card number.</p><div class="form-actions"><a class="primary-button secondary" href="menu.html">Add more dishes</a><button type="submit">Place order</button></div></form></main><script src="app.js"></script><script>renderCart();</script></body>
</html>
